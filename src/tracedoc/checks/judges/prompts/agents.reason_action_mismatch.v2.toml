id = "agents.reason_action_mismatch"
version = 2
group = "agents"
default_severity = "medium"
scope = ["run"]
triage = "Does an agent state a plan or conclusion and then take a different action than it stated?"
confirm = """
Decide whether an agent's stated reasoning and its action disagree: it says it will do X (or
concludes X is right) and in the same or next step does Y instead, with no explanation.

Quote the stated intention and the conflicting action (a tool call, a routing decision, or a
final answer).

Do not flag a change of plan that follows new information from a tool or another agent.
"""
