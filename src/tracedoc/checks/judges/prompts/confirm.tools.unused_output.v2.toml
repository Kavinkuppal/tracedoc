id = "tools.unused_output"
version = 2
group = "tools_cost"
default_severity = "medium"
scope = ["candidate"]
triage = "Did the agent's later answer or actions fail to reflect what this tool returned?"
confirms = "tools.unused_output"
confirm = """
A rule found little overlap between this tool's result and anything the model said or did
afterward. Decide whether the agent actually ignored the result: its later answer or actions do
not reflect the information the tool returned, or contradict it.

It is NOT ignored if the agent used the result in substance (paraphrased, summarized, acted on
it, or correctly concluded it was irrelevant and said so).
"""
