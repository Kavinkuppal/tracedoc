# ---------------------------------------------------------------------------------------------
# Checks. title: one line, plain language. looks_for: what the check looks for. why: why it
# matters. Rule checks also have per-finding templates (what_happened, what_to_change), in
# variants when one check reports different situations.

[checks."design.empty_answer"]
title = "Final answer was empty"
how = "rule"
looks_for = "Runs that finished, but whose final reply had no text: only tool calls, only punctuation, or no reply from an agent at all."
why = "The user asked a question and got nothing back."
what_happened = "{agent}'s final reply had no text, so the user got no answer."
what_to_change = "Add to {agent}'s prompt: \"Always end with a written answer for the user.\" Or add a graph edge that sends an empty reply back to {agent}."
what_to_change_in_place = "{agent}'s prompt already asks for a written answer, so enforce it in the graph: add an edge that sends an empty reply back to {agent} instead of ending the run."

[checks."design.run_error"]
title = "Run ended in an error"
how = "rule"
looks_for = "Runs that stopped with an error instead of an answer: a model call, a tool or another step raised an error that the system did not handle. LangGraph's own control-flow signals (a handoff passing control to another agent, or a deliberate pause) are not counted."
why = "The user got an error instead of an answer, and everything the run spent was wasted."

[checks."design.run_error".model]
what_happened = "{agent}'s model call failed, and the run ended with an error: {error}"
what_to_change = "Fix what {agent} sends to its model so this error can't recur, and catch model errors in {agent} so the user gets a message instead of a failed run."

[checks."design.run_error".parallel_handoff]
what_happened = "{sender} called {calls} in one reply. The handoff passed control before the other call's result was recorded, and {agent}'s next model call failed: {error}"
what_to_change = "Turn off parallel tool calls for {sender}'s model (bind its tools with parallel_tool_calls=False), so a handoff never shares a reply with another tool call."

[checks."design.run_error".tool]
what_happened = "{tool} failed for {agent}, and the run ended with an error: {error}"
what_to_change = "Make {tool} return an error message instead of raising, so {agent} can recover or tell the user."

[checks."design.run_error".run]
what_happened = "the run ended with an error: {error}"
what_to_change = "Catch errors in the graph so a failed run ends with a message to the user, and fix the cause in the error message."

[checks."design.loop"]
title = "Agent repeated the same step"
how = "rule"
looks_for = "The same tool called three or more times with identical arguments in one run (not counting retries after an error), the same tool called with nearly identical arguments (confirmed by the AI judge), or a cycle of agents that repeats with no change in results."
why = "Repeated steps cost tokens and time without adding information, and often mean the agent is stuck."

[checks."design.loop".identical]
what_happened = "{agent} called {tool} {count} times with the same arguments."
what_to_change = "Add to {agent}'s prompt: \"Don't call {tool} again with arguments you already used; reuse the earlier result.\" Or cache {tool} results by their arguments."
what_to_change_in_place = "{agent}'s prompt already says not to repeat calls, so enforce it: cache {tool} results by their arguments, or end the loop with a graph edge after a repeated call."

[checks."design.loop".near_duplicate]
what_happened = "{agent} called {tool} {count} times with nearly the same arguments."
what_to_change = "Add to {agent}'s prompt: \"If {tool} returns what you already have, change your approach or stop searching.\""
what_to_change_in_place = "{agent}'s prompt already says to stop when {tool} repeats itself, so enforce it: cap how many times {agent} can call {tool} in one run."

[checks."design.loop".cycle]
what_happened = "the agents went round {cycle} {count} times with no change in their results."
what_to_change = "Add an exit condition to the graph edge out of {agent}: end the run when a cycle produced nothing new."

[checks."design.no_stop"]
title = "Run never reached an answer"
how = "rule"
looks_for = "Runs that hit LangGraph's recursion limit, or took at least the configured maximum number of steps."
why = "The run used its whole step budget and the user got no answer."

[checks."design.no_stop".recursion]
what_happened = "the run hit the step limit without a final answer; {agent} ran most often ({count} times)."
what_to_change = "Give {agent} an explicit finish rule in its prompt and a graph edge to the end, and lower the recursion_limit setting so stuck runs fail fast."

[checks."design.no_stop".step_limit]
what_happened = "the run took {steps} steps (limit {limit}) without a final answer; {agent} ran most often ({count} times)."
what_to_change = "Give {agent} an explicit finish rule in its prompt and a graph edge to the end, and lower the recursion_limit setting so stuck runs fail fast."

[checks."tools.errors_retries"]
title = "Tool failed and was retried the same way"
how = "rule"
looks_for = "Tool calls that failed, and retries of a failed call with exactly the same arguments."
why = "Retrying a failed call unchanged usually fails again, adding cost and delay before the run gives up."

[checks."tools.errors_retries".retried]
what_happened = "{tool} failed {errors} times and {agent} retried it {retries} times with the same arguments."
what_to_change = "Add to {agent}'s prompt: \"If {tool} fails, don't retry with the same arguments; change them or tell the user.\""
what_to_change_in_place = "{agent}'s prompt already says not to retry the same way, so make {tool}'s error say what to change, and cap retries of {tool} in the graph."

[checks."tools.errors_retries".failed]
what_happened = "{tool} failed {errors} times for {agent}."
what_to_change = "Fix the cause of {tool}'s failures, or make {tool} return a clear error message that {agent} can act on."

[checks."tools.unused_output"]
title = "Tool result was ignored"
how = "rule"
looks_for = "Tool results whose content barely appears in anything the agent said or did afterwards (confirmed by the AI judge). Handoffs to other agents are not counted."
why = "The agent paid for the tool call, then answered without using what it returned, sometimes contradicting it."
what_happened = "{agent} called {tool}, but its later replies used only {overlap} of what {tool} returned."
what_to_change = "Add to {agent}'s prompt: \"Base your answer on what {tool} returns. If the result doesn't fit the request, tell the user.\""
what_to_change_in_place = "{agent}'s prompt already says to base its answer on {tool}, so add a checking step after {agent} that compares its answer with what {tool} returned."

[checks."verification.unchecked_result"]
title = "Answer was not checked before finishing"
how = "rule"
looks_for = "Final answers that repeat numbers or facts from tool results with no checking step after the last tool call (confirmed by the AI judge)."
why = "Facts copied from tools can be wrong or misread; an unchecked answer passes those mistakes to the user."
what_happened = "{agent}'s final answer repeats facts from tool results ({facts}) with no check before finishing."
what_to_change = "Add a checking step: a critic agent after {agent}, or an instruction in {agent}'s prompt to compare the answer with the tool results before replying."

[checks."verification.unchecked_result".has_critic]
what_happened = "{agent}'s final answer repeats facts from tool results ({facts}), and the run's checking agent, {critic}, did not run after the last tool result."
what_to_change = "Route {agent}'s final answer through {critic}, which already exists in this system, after the last tool call and before finishing."

[checks."cost.token_hotspot"]
title = "One agent used most of the tokens"
how = "rule"
looks_for = "An agent that used a large share of a run's tokens, or input that grows steeply from one model call to the next."
why = "Token use drives cost and time; one heavy agent or a growing history is usually the cheapest thing to fix."

[checks."cost.token_hotspot".share]
what_happened = "{agent} used {share} of the run's tokens ({tokens} tokens)."
what_to_change = "Send {agent}'s model less: trim old messages and unused state from its prompt, or use a cheaper model for {agent}."

# Used when the agent already runs the cheapest model of its family in the price table, or a
# model with no known price: then nothing in the trace shows that a cheaper model exists.
[checks."cost.token_hotspot".share_trim]
what_happened = "{agent} used {share} of the run's tokens ({tokens} tokens)."
what_to_change = "Send {agent}'s model less: trim old messages and unused state from what each of its model calls receives."

[checks."cost.token_hotspot".growth]
what_happened = "the input to {agent}'s model calls grew {growth} times over {calls} calls, to {tokens} tokens."
what_to_change = "Trim the message history passed to {agent}'s model calls: keep the last few messages and a short summary."

[checks."cost.latency_outlier"]
title = "Step was much slower than usual"
how = "rule"
looks_for = "Steps far slower than the 95th percentile for the same agent or tool across the analyzed runs, or slower than a fixed limit."
why = "Slow steps delay the whole run and often point to long inputs or a slow external service."

[checks."cost.latency_outlier".relative]
what_happened = "a {label} step by {agent} took {seconds}, {ratio} times the usual 95th percentile of {p95}."
what_to_change = "Set a timeout on {label} and check its slow cases for very long inputs or a slow external call."

[checks."cost.latency_outlier".absolute]
what_happened = "a {label} step by {agent} took {seconds}, over the {limit} limit."
what_to_change = "Set a timeout on {label} and check its slow cases for very long inputs or a slow external call."

[checks."design.ignored_instructions"]
title = "Agent ignored its instructions"
how = "judge"
looks_for = "An agent that clearly disobeys an explicit instruction in its own prompt or in the user's request."
why = "Your system depends on each agent keeping to its role; when one doesn't, the result can't be trusted."

[checks."design.lost_context"]
title = "Agent lost earlier context"
how = "judge"
looks_for = "An agent that contradicts, forgets or redoes something already established earlier in the same run."
why = "Lost context leads to wrong answers, repeated questions and wasted steps."

[checks."agents.incomplete_handoff"]
title = "Handoff left out needed information"
how = "judge"
looks_for = "A handoff after which the receiving agent lacked information it needed, because the handoff did not pass it along."
why = "The next agent works from incomplete information, so its result is wrong or incomplete."

[checks."agents.ignored_output"]
title = "Agent ignored another agent's output"
how = "judge"
looks_for = "An agent that received another agent's output but dropped or contradicted an important part of it."
why = "Work done by one agent is lost, and caveats or corrections never reach the user."

[checks."agents.reason_action_mismatch"]
title = "Agent did something other than it said"
how = "judge"
looks_for = "An agent that states a plan or conclusion and then takes a different action, without a reason."
why = "The agent's stated reasoning can't be trusted to explain what it does."

[checks."agents.no_clarification"]
title = "Agent guessed instead of asking"
how = "judge"
looks_for = "A genuinely ambiguous request answered with a silent guess instead of a question or a stated assumption."
why = "A wrong guess produces a confident, wrong answer."

[checks."agents.task_drift"]
title = "Agent drifted off the task"
how = "judge"
looks_for = "Work or a final answer that moves away from what the user actually asked."
why = "The user doesn't get what they asked for, and the run spends effort on something else."

[checks."verification.premature_finish"]
title = "Run finished before the task was done"
how = "judge"
looks_for = "Runs that ended while part of the request was not done, a required step was skipped, or the answer promised something that never happened. Stopping to ask the user about mismatched tool results is not counted."
why = "The user believes the task is done when it isn't."

# ---------------------------------------------------------------------------------------------
# Good-behavior signals ("What's working").

[signals."good.error_recovery"]
title = "Recovered after a tool error"
line = "{agent} recovered from a tool error by changing approach in {runs} of {total_runs}."
looks_for = "A tool error followed by a different, successful tool call."
what_happened = "after {failed} failed, {agent} changed approach and {recovered} succeeded."

[signals."good.verified"]
title = "Checked the answer before finishing"
line = "{agent} checked the result before the run finished in {runs} of {total_runs}."
looks_for = "A checking step (a critic) after the last tool result and before the end."
what_happened = "{agent} checked the result before the run finished."

[signals."good.efficient_path"]
title = "Finished in few steps"
line = "{runs} of {total_runs} delivered an answer, with no findings, in at most half the usual number of steps for their kind of task."
looks_for = "Runs that delivered an answer, used at least one tool, had no findings, and took at most half the median number of steps for the same kind of task. Runs that only asked the user a question don't count."
what_happened = "the run finished in {steps} steps, at most half the median of {median} for {task} runs."

[signals."good.clean_handoff"]
title = "Handoff carried the needed information"
line = "{agent} received what {sender} wrote in {runs} of {total_runs}."
looks_for = "A handoff from one agent to another where the receiving agent's first model call contains most of what the sending agent wrote. The user's request, which every agent sees, doesn't count."
what_happened = "{agent} received {share} of what {sender} wrote."