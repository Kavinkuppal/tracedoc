# tracedoc report catalog. Reviewed text only.
#
# Every heading, label, check title, check explanation and "why it matters" sentence in
# summary.pdf and details.pdf comes from this file. So do the sentences that describe rule
# findings: they are templates filled with facts from the traces ({agent}, {tool}, counts).
# Models never write anything here. Model-written text is limited to three slots per AI-judge
# finding (what happened, what to change, one evidence quote), with fixed character limits.
#
# Placeholders are filled by tracedoc/catalog.py; a placeholder without a value is an error.
# Per-finding sentences are clauses: the report prefixes them with "In {run}, " or
# "In {runs} of {total} runs, ", so they start with an agent name or a lower-case word.

version = 1

