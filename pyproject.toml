[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracedoc"
dynamic = ["version"]
description = "Diagnose LangGraph agent traces: what went right, what went wrong, and what to fix first."
readme = "README.md"
requires-python = ">=3.10"
# TODO: license (MIT or Apache 2.0), founders to decide
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "platformdirs>=4.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "langchain-core>=0.3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
langsmith = ["langsmith>=0.2"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "langgraph>=0.2",
    "langsmith>=0.2",
]

[project.scripts]
tracedoc = "tracedoc.cli:app"

[tool.hatch.version]
path = "src/tracedoc/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tracedoc"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "SIM", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
